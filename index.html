<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMNIA Dashboard</title>
<style>
:root{--navy:#1B2A4A;--gold:#C9A96E;--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.hide{display:none!important}
.app{display:flex;min-height:100vh}
aside{width:220px;background:var(--navy);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:600;letter-spacing:.5px;color:#fff;font-size:15px;margin-bottom:24px}
.brand span{color:var(--gold)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cbd5e1;padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:4px}
nav button:hover,nav button.on{background:rgba(255,255,255,.08);color:#fff}
nav button.on{box-shadow:inset 3px 0 0 var(--gold)}
main{flex:1;padding:24px;max-width:1100px;width:100%}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stat .l{color:var(--mut);font-size:12px}
.stat .v{font-size:24px;font-weight:600;margin-top:4px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#f3f4f6;color:var(--mut);margin-right:6px}
.tag.ok{background:#dcfce7;color:var(--ok)}
.tag.warn{background:#fef3c7;color:var(--warn)}
.tag.bad{background:#fee2e2;color:var(--bad)}
.res{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.5;max-height:260px;overflow:auto}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--mut)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#gate{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
@media(max-width:820px){
 aside{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;padding:6px;z-index:10}
 .brand{display:none}
 nav{display:flex;overflow-x:auto}
 nav button{margin:0 2px;text-align:center;white-space:nowrap;font-size:12px;padding:8px 10px;width:auto}
 nav button.on{box-shadow:none;background:var(--gold);color:var(--navy)}
 main{padding:16px 14px 90px}
}
</style>
</head>
<body>

<div id="gate" class="hide">
 <div class="brand" style="color:var(--navy)">OMNIA <span style="color:var(--gold)">Corporation</span></div>
 <div id="gKey" class="hide">
  <p class="muted">Tempel publishable key Supabase (cukup sekali di perangkat ini).</p>
  <input id="key" placeholder="sb_publishable_...">
  <div class="actions"><button class="btn" id="saveKey">Simpan</button></div>
 </div>
 <div id="gLogin" class="hide">
  <p class="muted">Masuk sebagai owner.</p>
  <input id="email" type="email" placeholder="Email" autocapitalize="off" style="margin-bottom:8px">
  <input id="pw" type="password" placeholder="Password">
  <div class="actions"><button class="btn" id="doLogin">Masuk</button></div>
 </div>
 <div class="err" id="gErr"></div>
</div>

<div class="app hide" id="app">
 <aside>
  <div class="brand">OMNIA <span>Corp</span></div>
  <nav id="nav">
   <button data-p="home" class="on">Beranda</button>
   <button data-p="emp">Karyawan</button>
   <button data-p="ceo">CEO</button>
   <button data-p="hasil">Hasil</button>
   <button data-p="appr">Setujui</button>
   <button data-p="sales">Penjualan</button>
   <button data-p="prospek">Prospek</button>
   <button data-p="akun">Akun</button>
  </nav>
 </aside>
 <main id="main"></main>
</div>

<script>
const SB="https://ianvkkefykbhvmxummye.supabase.co";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
const fmt=d=>d?new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const stat=(l,v,s)=>`<div class="card stat"><div class="l">${l}</div><div class="v">${v}</div><div class="muted" style="font-size:12px">${s}</div></div>`;
const taskRow=t=>`<div class="row"><b>${esc(t.goal)}</b><div class="muted" style="margin:4px 0">${esc(t.agents?.code||"-")} · ${esc(t.agents?.name||"")} · ${fmt(t.created_at)}</div><span class="tag ${t.status==="completed"?"ok":t.status==="failed"?"bad":""}">${esc(t.status)}</span>${t.review_notes?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(String(t.review_notes).slice(0,140))}</div>`:""}</div>`;

let KEY=localStorage.getItem("omnia_publishable_key")||"";
let TOK=localStorage.getItem("omnia_token")||"";
let PAGE="home", TIMER=null, FILTER="Semua";

const hdr=()=>({apikey:KEY,Authorization:"Bearer "+(TOK||KEY),"Content-Type":"application/json"});
async function api(path,opt={}){
 const r=await fetch(SB+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});
 const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){ const e=new Error((j&&(j.message||j.error_description||j.hint))||("HTTP "+r.status)); e.status=r.status; throw e; }
 return j;
}

function showGate(w){
 $("app").classList.add("hide");
 $("gate").classList.remove("hide");
 $("gKey").classList.toggle("hide",w!=="key");
 $("gLogin").classList.toggle("hide",w!=="login");
}

$("saveKey").onclick=()=>{
 const k=$("key").value.trim();
 if(!k){ $("gErr").textContent="Key belum diisi."; return; }
 KEY=k; localStorage.setItem("omnia_publishable_key",k); $("gErr").textContent="";
 start();
};
$("doLogin").onclick=async()=>{
 $("gErr").textContent="Memproses...";
 try{
  const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("pw").value})});
  const j=await r.json();
  if(!j.access_token) throw new Error(j.error_description||j.msg||"Login gagal");
  TOK=j.access_token; localStorage.setItem("omnia_token",TOK); $("gErr").textContent="";
  start();
 }catch(e){ $("gErr").textContent=e.message; }
};

async function start(){
 if(!KEY) return showGate("key");
 if(!TOK) return showGate("login");
 try{
  const o=await api("/rest/v1/organizations?select=id&name=eq.OMNIA%20AI%20Corporation");
  if(!o[0]) throw new Error("Organisasi tidak ditemukan");
  $("gate").classList.add("hide"); $("app").classList.remove("hide");
  go(PAGE);
 }catch(e){
  if(e.status===401){ TOK=""; localStorage.removeItem("omnia_token"); return showGate("login"); }
  $("gErr").textContent=e.message; showGate("login");
 }
}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function go(p){
 PAGE=p;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
 clearInterval(TIMER);
 TIMER=setInterval(()=>{ if(PAGE!=="ceo") render(); },30000);
 render();
 window.scrollTo(0,0);
}

async function render(){
 try{ await PAGES[PAGE]($("main")); }
 catch(e){
  if(e.status===401){ TOK=""; localStorage.removeItem("omnia_token"); return showGate("login"); }
  $("main").innerHTML=`<div class="card err">Gagal memuat: ${esc(e.message)}</div>`;
 }
}

async function pHome(m){
 const [ag,tk,ap,recent]=await Promise.all([
  api("/rest/v1/agents?select=code,status&limit=200"),
  api("/rest/v1/tasks?select=status&limit=2000"),
  api("/rest/v1/approvals?select=id&status=eq.pending&limit=200"),
  api("/rest/v1/tasks?select=goal,status,review_notes,created_at,agents(code,name)&order=created_at.desc&limit=8")
 ]);
 const cnt=s=>tk.filter(t=>t.status===s).length;
 const online=ag.filter(a=>a.status==="online").length;
 m.innerHTML=head("Beranda","Ringkasan perusahaan hari ini, dari data database.")+
 `<div class="grid">
  ${stat("Karyawan AI",ag.length,online+" online")}
  ${stat("Sedang bekerja",cnt("assigned")+cnt("running"),"tugas aktif")}
  ${stat("Tugas selesai",cnt("completed"),"sepanjang waktu")}
  ${stat("Menunggu persetujuan",ap.length,"butuh keputusan Anda")}
 </div>
 <div class="card"><b>Tugas terbaru</b><div style="margin-top:8px">${recent.map(taskRow).join("")||'<p class="muted">Belum ada tugas.</p>'}</div></div>`;
}

async function pEmp(m){
 const ag=await api("/rest/v1/agents?select=code,name,title,status&order=code&limit=200");
 m.innerHTML=head("Karyawan",`${ag.length} karyawan AI dengan jabatan masing-masing.`)+
 `<div class="card">${ag.map(a=>`<div class="row"><b>${esc(a.name)}</b> <span class="muted">${esc(a.code)}</span><div class="muted" style="margin:2px 0">${esc(a.title)}</div><span class="tag ${a.status==="online"?"ok":""}">${esc(a.status||"-")}</span></div>`).join("")}</div>`;
}

async function pCeo(m){
 if(!$("send")){
  m.innerHTML=head("CEO","Tulis tujuan. CEO menyusun rencana dan membagi tugas ke karyawan sesuai jabatannya.")+
  `<div class="card"><textarea id="cmd" placeholder="Contoh: Susun rencana riset produk digital untuk UMKM"></textarea>
   <div class="actions"><button class="btn" id="send">Kirim ke CEO</button></div><div class="err" id="cmdMsg"></div></div>
   <div class="card"><b>Tugas CEO</b><div id="ceoList" style="margin-top:8px"></div></div>`;
  $("send").onclick=async()=>{
   const t=$("cmd").value.trim(); if(!t) return;
   $("send").disabled=true; $("cmdMsg").textContent="Mengirim...";
   try{
    await api("/rest/v1/rpc/ceo_command",{method:"POST",body:JSON.stringify({p_goal:t})});
    $("cmd").value=""; $("cmdMsg").textContent="Terkirim. Hasilnya muncul setelah diperiksa AUD-01.";
    loadCeo();
   }catch(e){ $("cmdMsg").textContent="Gagal: "+e.message; }
   if($("send")) $("send").disabled=false;
  };
 }
 loadCeo();
}
async function loadCeo(){
 const rows=await api("/rest/v1/tasks?select=goal,status,review_notes,created_at,agents!inner(code,name)&agents.code=eq.CEO-01&order=created_at.desc&limit=10");
 const el=$("ceoList"); if(el) el.innerHTML=rows.map(taskRow).join("")||'<p class="muted">Belum ada tugas CEO.</p>';
}

async function pHasil(m){
 if(!$("dList")){
  m.innerHTML=head("Hasil","Hasil kerja yang sudah lolos pemeriksaan AUD-01. Salin atau unduh untuk dipakai.")+
  `<div class="chips">${["Semua","Teks","Deskripsi","Gambar","File"].map(f=>`<button class="chip" data-f="${f}">${f}</button>`).join("")}</div><div id="dList"></div>`;
  m.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ FILTER=b.dataset.f; loadHasil(); });
 }
 loadHasil();
}
async function loadHasil(){
 const el=$("dList"); if(!el) return;
 const rows=await api("/rest/v1/deliverables?select=id,kind,title,content,url,created_at&order=created_at.desc&limit=60");
 document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.f===FILTER));
 const list=FILTER==="Semua"?rows:rows.filter(r=>r.kind===FILTER.toLowerCase());
 el.innerHTML=list.map(r=>`<div class="card">
  <div><span class="tag">${esc(r.kind)}</span><span class="muted" style="font-size:12px">${fmt(r.created_at)}</span></div>
  <b style="display:block;margin-top:6px">${esc(r.title)}</b>
  ${r.kind==="gambar"&&r.url?`<img src="${esc(r.url)}" style="max-width:100%;border-radius:10px;margin-top:8px">`:""}
  <div class="res">${esc(r.content||"")}</div>
  <div class="actions"><button class="btn ghost" data-copy="${r.id}">Salin</button><button class="btn ghost" data-dl="${r.id}">Unduh .txt</button></div>
 </div>`).join("")||'<p class="muted">Belum ada hasil.</p>';
 el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.copy); copyText(r?.content||"",b); });
 el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.dl); download((r?.title||"hasil")+".txt",r?.content||""); });
}
async function copyText(t,btn){
 try{ await navigator.clipboard.writeText(t); btn.textContent="Tersalin"; }
 catch(e){ btn.textContent="Salin manual"; }
 setTimeout(()=>btn.textContent="Salin",1500);
}
function download(name,text){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
 a.download=name.replace(/[\\/:*?"<>|]/g,"-");
 a.click();
}

async function pAppr(m){
 const rows=await api("/rest/v1/approvals?select=id,action_type,reason,impact,content,level,created_at&status=eq.pending&order=created_at.desc&limit=50");
 m.innerHTML=head("Setujui","Keputusan yang menunggu Anda. Setujui hanya jika isinya jelas dan Anda memahaminya.")+
 (rows.map(r=>{
  const kosong=!r.content||String(r.content).trim().length<40;
  return `<div class="card">
   <div><span class="tag ${r.level==="red"?"bad":"warn"}">${esc(r.level||"")}</span><span class="muted" style="font-size:12px">${fmt(r.created_at)}</span></div>
   <b style="display:block;margin-top:6px">${esc(r.action_type)}</b>
   ${r.reason?`<p class="muted" style="margin:6px 0">Alasan: ${esc(r.reason)}</p>`:""}
   ${r.impact?`<p class="muted" style="margin:6px 0">Dampak: ${esc(r.impact)}</p>`:""}
   <div class="res">${esc(r.content||"(isi kosong)")}</div>
   ${kosong?'<p class="err">Isi usulan kosong atau tidak lengkap. Sebaiknya tolak.</p>':""}
   <div class="actions">
    <button class="btn" data-ap="${r.id}" data-d="approved" ${kosong?"disabled":""}>Setujui</button>
    <button class="btn ghost" data-ap="${r.id}" data-d="rejected">Tolak</button>
   </div></div>`;
 }).join("")||'<div class="card"><p class="muted">Tidak ada keputusan yang menunggu.</p></div>');
 m.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{
  if(b.dataset.d==="approved" && !confirm("Setujui keputusan ini?")) return;
  b.disabled=true;
  try{
   await api("/rest/v1/rpc/decide_approval",{method:"POST",body:JSON.stringify({p_approval:b.dataset.ap,p_decision:b.dataset.d})});
   render();
  }catch(e){ alert("Gagal: "+e.message); b.disabled=false; }
 });
}

async function pSales(m){
 const rows=await api("/rest/v1/payments?select=amount,source,verified,created_at&order=created_at.desc&limit=100");
 const ok=rows.filter(r=>r.verified), wait=rows.filter(r=>!r.verified);
 const total=ok.reduce((s,r)=>s+Number(r.amount||0),0);
 m.innerHTML=head("Penjualan","Hanya pembayaran yang sudah terverifikasi dihitung sebagai pendapatan.")+
 `<div class="grid">${stat("Pendapatan terverifikasi",rp(total),ok.length+" transaksi")}${stat("Menunggu verifikasi",wait.length,"belum dihitung")}</div>
 <div class="card"><span class="muted">Bagi hasil dihitung sistem dari keuntungan bersih: owner 70%, dana AI 30%.</span></div>
 <div class="card">${rows.map(r=>`<div class="row"><b>${rp(r.amount)}</b> <span class="muted">${esc(r.source||"-")}</span><div class="muted" style="font-size:12px;margin:2px 0">${fmt(r.created_at)}</div><span class="tag ${r.verified?"ok":"warn"}">${r.verified?"terverifikasi":"menunggu"}</span></div>`).join("")||'<p class="muted">Belum ada pembayaran.</p>'}</div>`;
}

async function pProspek(m){
 const rows=await api("/rest/v1/leads?select=name,channel,stage,consent,created_at&order=created_at.desc&limit=100");
 m.innerHTML=head("Prospek","Calon pembeli. Hanya yang sudah memberi izin boleh dihubungi.")+
 `<div class="grid">${stat("Total prospek",rows.length,"")}${stat("Sudah memberi izin",rows.filter(r=>r.consent).length,"boleh dihubungi")}</div>
 <div class="card">${rows.map(r=>`<div class="row"><b>${esc(r.name||"tanpa nama")}</b> <span class="muted">${esc(r.channel||"-")}</span><div class="muted" style="font-size:12px;margin:2px 0">${esc(r.stage)} · ${fmt(r.created_at)}</div><span class="tag ${r.consent?"ok":""}">${r.consent?"izin dihubungi":"belum ada izin"}</span></div>`).join("")||'<p class="muted">Belum ada prospek.</p>'}</div>`;
}

async function pAkun(m){
 m.innerHTML=head("Akun","Sesi dan keamanan dashboard.")+
 `<div class="card"><b>Sesi</b><p class="muted">Keluar dari perangkat ini.</p><button class="btn ghost" id="logout">Keluar</button></div>
  <div class="card"><b>Keamanan</b><p class="muted">Aktifkan verifikasi dua langkah di email, Supabase, dan Lynk. Ganti password jika ada aktivitas yang tidak Anda kenali.</p></div>`;
 $("logout").onclick=()=>{ TOK=""; localStorage.removeItem("omnia_token"); clearInterval(TIMER); showGate("login"); };
}

const PAGES={home:pHome,emp:pEmp,ceo:pCeo,hasil:pHasil,appr:pAppr,sales:pSales,prospek:pProspek,akun:pAkun};
start();
</script>
</body>
</html>
