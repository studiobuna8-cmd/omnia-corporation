<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMNIA Dashboard</title>
<style>
:root{
 --navy:#1B2A4A;--navy2:#26395F;--gold:#C9A96E;
 --bg:#f4f6fb;--card:#ffffff;--ink:#1e293b;--mut:#64748b;--line:#e7ebf2;
 --ok:#15803d;--okbg:#e9f7ef;--warn:#a16207;--warnbg:#fdf6e3;
 --bad:#b91c1c;--badbg:#fdeeee;--blue:#1d4ed8;--bluebg:#eaf1ff;
 --r:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hide{display:none!important}

/* layout */
.app{display:flex;min-height:100vh}
aside{width:232px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),var(--navy2));padding:26px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;letter-spacing:.3px;margin:0 0 30px 8px;font-size:15px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#e8d5b0);display:inline-block}
.brand small{display:block;color:#9fb0cc;font-weight:500;font-size:11px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:4px}
nav button{position:relative;text-align:left;background:none;border:0;color:#b9c6dc;padding:11px 14px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(201,169,110,.16);color:#fff;font-weight:600}
nav button.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
main{flex:1;padding:32px 36px;max-width:1140px;width:100%}

/* header */
.top{margin-bottom:24px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.top p{margin:4px 0 0;color:var(--mut)}
.greet{color:var(--mut);font-size:13px;margin-bottom:4px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -18px rgba(15,23,42,.12)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;gap:8px}
.stat .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px}
.stat .l{color:var(--mut);font-size:12.5px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.stat .s{color:var(--mut);font-size:12px}
.t-blue{background:var(--bluebg);color:var(--blue)}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-warn{background:var(--warnbg);color:var(--warn)}
.t-navy{background:#e9edf6;color:var(--navy)}

/* list rows */
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row:first-child{padding-top:0}
.row b{font-weight:600}
.meta{color:var(--mut);font-size:12.5px;margin-top:2px}

/* badges */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f1f4f9;color:var(--mut);margin-right:6px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.blue{background:var(--bluebg);color:var(--blue)}

/* text blocks */
.res{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;font-size:13.5px;line-height:1.6;max-height:300px;overflow:auto;color:#334155}
.note{background:#f8fafc;border-radius:12px;padding:12px 14px;color:var(--mut);font-size:13px}

/* form */
textarea,input{width:100%;border:1px solid #d9e0ea;border-radius:12px;padding:12px 14px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(27,42,74,.08)}
textarea{min-height:110px;resize:vertical}

/* buttons */
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:transform .08s,opacity .15s}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #d9e0ea}
.btn.gold{background:var(--gold);color:var(--navy)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid #d9e0ea;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* states */
.empty{text-align:center;padding:28px 12px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.pill{display:inline-block;font-size:12px;color:var(--mut)}

/* login */
#gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 50px -25px rgba(15,23,42,.25)}
#gate .brand{color:var(--navy);margin:0 0 6px}
#gate .brand i{width:34px;height:34px}
#gate .brand small{color:var(--mut)}
#gate p{color:var(--mut);margin:8px 0 16px}

/* mobile */
@media(max-width:820px){
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:20px 20px 0 0}
 .brand{display:none}
 nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
 nav::-webkit-scrollbar{display:none}
 nav button{flex:0 0 auto;text-align:center;font-size:12px;padding:9px 12px;border-radius:12px;white-space:nowrap}
 nav button.on{background:var(--gold);color:var(--navy)}
 nav button.on::before{display:none}
 main{padding:20px 16px 110px}
 .top h1{font-size:20px}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .stat .v{font-size:22px}
 .card{padding:16px}
}
</style>
</head>
<body>

<div id="gate" class="hide">
 <div class="brand"><i></i><div>OMNIA<small>Corporation</small></div></div>
 <div id="gKey" class="hide">
  <p>Tempel publishable key Supabase. Cukup sekali di perangkat ini.</p>
  <input id="key" placeholder="sb_publishable_...">
  <div class="actions"><button class="btn" id="saveKey">Simpan</button></div>
 </div>
 <div id="gLogin" class="hide">
  <p>Masuk sebagai owner untuk melihat perusahaan.</p>
  <input id="email" type="email" placeholder="Email" autocapitalize="off" style="margin-bottom:10px">
  <input id="pw" type="password" placeholder="Password">
  <div class="actions"><button class="btn" id="doLogin">Masuk</button></div>
 </div>
 <div class="err" id="gErr"></div>
</div>

<div class="app hide" id="app">
 <aside>
  <div class="brand"><i></i><div>OMNIA<small>AI Corporation</small></div></div>
  <nav id="nav">
   <button data-p="home" class="on">Beranda</button>
   <button data-p="emp">Karyawan</button>
   <button data-p="ceo">CEO</button>
   <button data-p="hasil">Hasil</button>
   <button data-p="appr">Setujui</button>
   <button data-p="sales">Penjualan</button>
   <button data-p="prospek">Prospek</button>
   <button data-p="akun">Akun</button>
  </nav>
 </aside>
 <main id="main"></main>
</div>

<script>
const SB="https://ianvkkefykbhvmxummye.supabase.co";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
const fmt=d=>d?new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const hi=()=>{const h=new Date().getHours();return h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam"};
const head=(t,s)=>`<div class="top"><h1>${t}</h1><p>${s}</p></div>`;
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s||""}</div>`;
const stat=(l,v,s,tone,ico)=>`<div class="card stat" style="margin:0"><div class="ic ${tone||"t-navy"}">${ico||""}</div><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`;
const taskRow=t=>`<div class="row"><b>${esc(t.goal)}</b><div class="meta">${esc(t.agents?.code||"-")} · ${esc(t.agents?.name||"")} · ${fmt(t.created_at)}</div><div style="margin-top:6px"><span class="tag ${t.status==="completed"?"ok":t.status==="failed"?"bad":t.status==="cancelled"?"":"blue"}">${esc(t.status)}</span></div>${t.review_notes?`<div class="meta" style="margin-top:6px">${esc(String(t.review_notes).slice(0,160))}</div>`:""}</div>`;

let KEY=localStorage.getItem("omnia_publishable_key")||"";
let TOK=localStorage.getItem("omnia_token")||"";
let PAGE="home", TIMER=null, FILTER="Semua";

const hdr=()=>({apikey:KEY,Authorization:"Bearer "+(TOK||KEY),"Content-Type":"application/json"});
async function api(path,opt={}){
 const r=await fetch(SB+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});
 const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){ const e=new Error((j&&(j.message||j.error_description||j.hint))||("HTTP "+r.status)); e.status=r.status; throw e; }
 return j;
}

function showGate(w){
 $("app").classList.add("hide");
 $("gate").classList.remove("hide");
 $("gKey").classList.toggle("hide",w!=="key");
 $("gLogin").classList.toggle("hide",w!=="login");
}

$("saveKey").onclick=()=>{
 const k=$("key").value.trim();
 if(!k){ $("gErr").textContent="Key belum diisi."; return; }
 KEY=k; localStorage.setItem("omnia_publishable_key",k); $("gErr").textContent="";
 start();
};
$("doLogin").onclick=async()=>{
 $("gErr").textContent="Memproses...";
 try{
  const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("pw").value})});
  const j=await r.json();
  if(!j.access_token) throw new Error(j.error_description||j.msg||"Login gagal");
  TOK=j.access_token; localStorage.setItem("omnia_token",TOK); $("gErr").textContent="";
  start();
 }catch(e){ $("gErr").textContent=e.message; }
};

async function start(){
 if(!KEY) return showGate("key");
 if(!TOK) return showGate("login");
 try{
  const o=await api("/rest/v1/organizations?select=id&name=eq.OMNIA%20AI%20Corporation");
  if(!o[0]) throw new Error("Organisasi tidak ditemukan");
  $("gate").classList.add("hide"); $("app").classList.remove("hide");
  go(PAGE);
 }catch(e){
  if(e.status===401){ TOK=""; localStorage.removeItem("omnia_token"); return showGate("login"); }
  $("gErr").textContent=e.message; showGate("login");
 }
}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function go(p){
 PAGE=p;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
 clearInterval(TIMER);
 TIMER=setInterval(()=>{ if(PAGE!=="ceo") render(); },30000);
 render();
 window.scrollTo(0,0);
}

async function render(){
 try{ await PAGES[PAGE]($("main")); }
 catch(e){
  if(e.status===401){ TOK=""; localStorage.removeItem("omnia_token"); return showGate("login"); }
  $("main").innerHTML=`<div class="card err">Gagal memuat: ${esc(e.message)}</div>`;
 }
}

async function pHome(m){
 const [ag,tk,ap,recent]=await Promise.all([
  api("/rest/v1/agents?select=code,status&limit=200"),
  api("/rest/v1/tasks?select=status&limit=2000"),
  api("/rest/v1/approvals?select=id&status=eq.pending&limit=200"),
  api("/rest/v1/tasks?select=goal,status,review_notes,created_at,agents(code,name)&order=created_at.desc&limit=8")
 ]);
 const cnt=s=>tk.filter(t=>t.status===s).length;
 const online=ag.filter(a=>a.status==="online").length;
 m.innerHTML=`<div class="greet">${hi()}, Owner</div>`+head("Beranda","Ringkasan perusahaan hari ini, dari data database.")+
 `<div class="grid">
  ${stat("Karyawan AI",ag.length,online+" online","t-navy","AI")}
  ${stat("Sedang bekerja",cnt("assigned")+cnt("running"),"tugas aktif","t-blue","▶")}
  ${stat("Tugas selesai",cnt("completed"),"sepanjang waktu","t-ok","✓")}
  ${stat("Menunggu persetujuan",ap.length,"butuh keputusan Anda","t-warn","!")}
 </div>
 <div class="card"><h3>Tugas terbaru</h3>${recent.map(taskRow).join("")||empty("Belum ada tugas.")}</div>`;
}

async function pEmp(m){
 const ag=await api("/rest/v1/agents?select=code,name,title,status&order=code&limit=200");
 m.innerHTML=head("Karyawan",`${ag.length} karyawan AI, masing-masing dengan jabatannya.`)+
 `<div class="card">${ag.map(a=>`<div class="row"><b>${esc(a.name)}</b> <span class="meta" style="margin-left:6px">${esc(a.code)}</span><div class="meta">${esc(a.title)}</div><div style="margin-top:6px"><span class="tag ${a.status==="online"?"ok":""}">${esc(a.status||"-")}</span></div></div>`).join("")||empty("Belum ada karyawan.")}</div>`;
}

async function pCeo(m){
 if(!$("send")){
  m.innerHTML=head("CEO","Tulis tujuan. CEO menyusun rencana dan membagi tugas ke karyawan sesuai jabatannya.")+
  `<div class="card"><h3>Tujuan baru</h3><textarea id="cmd" placeholder="Contoh: Susun rencana riset produk digital untuk UMKM"></textarea>
   <div class="actions"><button class="btn" id="send">Kirim ke CEO</button></div><div class="err" id="cmdMsg"></div></div>
   <div class="card"><h3>Tugas CEO</h3><div id="ceoList"></div></div>`;
  $("send").onclick=async()=>{
   const t=$("cmd").value.trim(); if(!t) return;
   $("send").disabled=true; $("cmdMsg").textContent="Mengirim...";
   try{
    await api("/rest/v1/rpc/ceo_command",{method:"POST",body:JSON.stringify({p_goal:t})});
    $("cmd").value=""; $("cmdMsg").textContent="Terkirim. Hasilnya muncul setelah diperiksa AUD-01.";
    loadCeo();
   }catch(e){ $("cmdMsg").textContent="Gagal: "+e.message; }
   if($("send")) $("send").disabled=false;
  };
 }
 loadCeo();
}
async function loadCeo(){
 const rows=await api("/rest/v1/tasks?select=goal,status,review_notes,created_at,agents!inner(code,name)&agents.code=eq.CEO-01&order=created_at.desc&limit=10");
 const el=$("ceoList"); if(el) el.innerHTML=rows.map(taskRow).join("")||empty("Belum ada tugas CEO.");
}

async function pHasil(m){
 if(!$("dList")){
  m.innerHTML=head("Hasil","Hasil yang sudah lolos pemeriksaan AUD-01. Salin atau unduh untuk dipakai.")+
  `<div class="chips">${["Semua","Teks","Deskripsi","Gambar","File"].map(f=>`<button class="chip" data-f="${f}">${f}</button>`).join("")}</div><div id="dList"></div>`;
  m.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ FILTER=b.dataset.f; loadHasil(); });
 }
 loadHasil();
}
async function loadHasil(){
 const el=$("dList"); if(!el) return;
 const rows=await api("/rest/v1/deliverables?select=id,kind,title,content,url,created_at&order=created_at.desc&limit=60");
 document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.f===FILTER));
 const list=FILTER==="Semua"?rows:rows.filter(r=>r.kind===FILTER.toLowerCase());
 el.innerHTML=list.map(r=>`<div class="card">
  <div><span class="tag blue">${esc(r.kind)}</span><span class="meta">${fmt(r.created_at)}</span></div>
  <h3 style="margin:10px 0 0">${esc(r.title)}</h3>
  ${r.kind==="gambar"&&r.url?`<img src="${esc(r.url)}" style="max-width:100%;border-radius:12px;margin-top:10px">`:""}
  <div class="res">${esc(r.content||"")}</div>
  <div class="actions"><button class="btn ghost" data-copy="${r.id}">Salin</button><button class="btn ghost" data-dl="${r.id}">Unduh .txt</button></div>
 </div>`).join("")||empty("Belum ada hasil.","Hasil akan muncul di sini setelah lolos pemeriksaan.");
 el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.copy); copyText(r?.content||"",b); });
 el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.dl); download((r?.title||"hasil")+".txt",r?.content||""); });
}
async function copyText(t,btn){
 const old=btn.textContent;
 try{ await navigator.clipboard.writeText(t); btn.textContent="Tersalin"; }
 catch(e){ btn.textContent="Salin manual"; }
 setTimeout(()=>btn.textContent=old,1500);
}
function download(name,text){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
 a.download=name.replace(/[\\/:*?"<>|]/g,"-");
 a.click();
}

async function pAppr(m){
 const rows=await api("/rest/v1/approvals?select=id,action_type,reason,impact,content,level,created_at&status=eq.pending&order=created_at.desc&limit=50");
 m.innerHTML=head("Setujui","Keputusan yang menunggu Anda. Setujui hanya jika isinya jelas dan Anda memahaminya.")+
 (rows.map(r=>{
  const kosong=!r.content||String(r.content).trim().length<40;
  return `<div class="card">
   <div><span class="tag ${r.level==="red"?"bad":"warn"}">${esc(r.level||"")}</span><span class="meta">${fmt(r.created_at)}</span></div>
   <h3 style="margin:10px 0 0">${esc(r.action_type)}</h3>
   ${r.reason?`<div class="meta" style="margin-top:8px">Alasan: ${esc(r.reason)}</div>`:""}
   ${r.impact?`<div class="meta">Dampak: ${esc(r.impact)}</div>`:""}
   <div class="res">${esc(r.content||"(isi kosong)")}</div>
   ${kosong?'<div class="err">Isi usulan kosong atau tidak lengkap. Sebaiknya tolak.</div>':""}
   <div class="actions">
    <button class="btn" data-ap="${r.id}" data-d="approved" ${kosong?"disabled":""}>Setujui</button>
    <button class="btn ghost" data-ap="${r.id}" data-d="rejected">Tolak</button>
   </div></div>`;
 }).join("")||empty("Tidak ada keputusan yang menunggu.","Semua sudah beres."));
 m.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{
  if(b.dataset.d==="approved" && !confirm("Setujui keputusan ini?")) return;
  b.disabled=true;
  try{
   await api("/rest/v1/rpc/decide_approval",{method:"POST",body:JSON.stringify({p_approval:b.dataset.ap,p_decision:b.dataset.d})});
   render();
  }catch(e){ alert("Gagal: "+e.message); b.disabled=false; }
 });
}

async function pSales(m){
 const rows=await api("/rest/v1/payments?select=amount,source,verified,created_at&order=created_at.desc&limit=100");
 const ok=rows.filter(r=>r.verified), wait=rows.filter(r=>!r.verified);
 const total=ok.reduce((s,r)=>s+Number(r.amount||0),0);
 m.innerHTML=head("Penjualan","Hanya pembayaran yang sudah terverifikasi dihitung sebagai pendapatan.")+
 `<div class="grid">${stat("Pendapatan terverifikasi",rp(total),ok.length+" transaksi","t-ok","Rp")}${stat("Menunggu verifikasi",wait.length,"belum dihitung","t-warn","…")}</div>
 <div class="card"><div class="note">Bagi hasil dihitung sistem dari keuntungan bersih: owner 70%, dana AI 30%.</div></div>
 <div class="card">${rows.map(r=>`<div class="row"><b>${rp(r.amount)}</b> <span class="meta" style="margin-left:6px">${esc(r.source||"-")}</span><div class="meta">${fmt(r.created_at)}</div><div style="margin-top:6px"><span class="tag ${r.verified?"ok":"warn"}">${r.verified?"terverifikasi":"menunggu"}</span></div></div>`).join("")||empty("Belum ada pembayaran.")}</div>`;
}

async function pProspek(m){
 const rows=await api("/rest/v1/leads?select=name,channel,stage,consent,created_at&order=created_at.desc&limit=100");
 m.innerHTML=head("Prospek","Calon pembeli. Hanya yang sudah memberi izin boleh dihubungi.")+
 `<div class="grid">${stat("Total prospek",rows.length,"","t-navy","P")}${stat("Sudah memberi izin",rows.filter(r=>r.consent).length,"boleh dihubungi","t-ok","✓")}</div>
 <div class="card">${rows.map(r=>`<div class="row"><b>${esc(r.name||"tanpa nama")}</b> <span class="meta" style="margin-left:6px">${esc(r.channel||"-")}</span><div class="meta">${esc(r.stage)} · ${fmt(r.created_at)}</div><div style="margin-top:6px"><span class="tag ${r.consent?"ok":""}">${r.consent?"izin dihubungi":"belum ada izin"}</span></div></div>`).join("")||empty("Belum ada prospek.")}</div>`;
}

async function pAkun(m){
 m.innerHTML=head("Akun","Sesi dan keamanan dashboard.")+
 `<div class="card"><h3>Sesi</h3><p class="meta" style="margin:0 0 12px">Keluar dari perangkat ini.</p><button class="btn ghost" id="logout">Keluar</button></div>
  <div class="card"><h3>Keamanan</h3><p class="meta" style="margin:0">Aktifkan verifikasi dua langkah di email, Supabase, dan Lynk. Ganti password jika ada aktivitas yang tidak Anda kenali.</p></div>`;
 $("logout").onclick=()=>{ TOK=""; localStorage.removeItem("omnia_token"); clearInterval(TIMER); showGate("login"); };
}

const PAGES={home:pHome,emp:pEmp,ceo:pCeo,hasil:pHasil,appr:pAppr,sales:pSales,prospek:pProspek,akun:pAkun};
start();
